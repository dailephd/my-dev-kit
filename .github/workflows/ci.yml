name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
      - 'audit/**'
  pull_request:

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Test
        run: npm run test

      - name: Package dry run
        run: npm pack --dry-run --json

      - name: CLI help
        run: node dist/cli.js --help

      - name: CLI version
        run: node dist/cli.js --version

      - name: Smoke - index TypeScript example
        run: node dist/cli.js index --root examples/basic-ts --src src --out .my-dev-kit-ci --call-graph --json

      - name: Smoke - search TypeScript example
        run: node dist/cli.js search --index examples/basic-ts/.my-dev-kit-ci --query user --limit 5 --json

      - name: Smoke - source TypeScript example
        run: node dist/cli.js source --index examples/basic-ts/.my-dev-kit-ci --contains User --format json

      - name: Smoke - context TypeScript example
        run: node dist/cli.js context --index examples/basic-ts/.my-dev-kit-ci --query "user service" --out examples/basic-ts/.my-dev-kit-ci/context-capsule.json --json

      - name: Smoke - view TypeScript example (DOT)
        run: node dist/cli.js view --index examples/basic-ts/.my-dev-kit-ci --format dot --out examples/basic-ts/.my-dev-kit-ci/graph.dot --edge-style semantic --json

      - name: Smoke - v1.11 Compose and Android test retrieval
        run: |
          node dist/cli.js index --root tests/fixtures/compose-retrieval/basic-app --src app/src/main --out .my-dev-kit-ci-v1.11 --call-graph --json
          node -e "const fs=require('fs');const p='tests/fixtures/compose-retrieval/basic-app/.my-dev-kit-ci-v1.11';for(const f of ['android-compose-semantic.json','code-graph.json','manifest.json'])if(!fs.existsSync(p+'/'+f))throw new Error('missing '+f)"
          node dist/cli.js source --index tests/fixtures/compose-retrieval/basic-app/.my-dev-kit-ci-v1.11 --composable HomeScreen --include-compose-tree --format json
          node dist/cli.js slice --index tests/fixtures/compose-retrieval/basic-app/.my-dev-kit-ci-v1.11 --composable HomeScreen --include-viewmodel --include-navigation --json
          node dist/cli.js view --index tests/fixtures/compose-retrieval/basic-app/.my-dev-kit-ci-v1.11 --graph compose-ui --format dot --out tests/fixtures/compose-retrieval/basic-app/.my-dev-kit-ci-v1.11/compose-ui.dot --json
          node dist/cli.js view --index tests/fixtures/compose-retrieval/basic-app/.my-dev-kit-ci-v1.11 --graph compose-navigation --format dot --out tests/fixtures/compose-retrieval/basic-app/.my-dev-kit-ci-v1.11/compose-navigation.dot --json
          node dist/cli.js index --root tests/fixtures/android-test-semantic/basic-app --src app/src/main --out .my-dev-kit-ci-v1.11 --json
          node -e "const fs=require('fs');const p='tests/fixtures/android-test-semantic/basic-app/.my-dev-kit-ci-v1.11';for(const f of ['android-compose-semantic.json','android-test-semantic.json','code-graph.json','manifest.json'])if(!fs.existsSync(p+'/'+f))throw new Error('missing '+f)"
          node dist/cli.js search --index tests/fixtures/android-test-semantic/basic-app/.my-dev-kit-ci-v1.11 --query HomeScreenTest --json
          node dist/cli.js view --index tests/fixtures/android-test-semantic/basic-app/.my-dev-kit-ci-v1.11 --graph android-test --format dot --out tests/fixtures/android-test-semantic/basic-app/.my-dev-kit-ci-v1.11/android-test.dot --json

      - name: Smoke - index Python example
        run: node dist/cli.js index --root examples/basic-python --src src --language python --out .my-dev-kit-ci --json

      - name: Clean up CI smoke artifacts
        run: |
          node -e "require('fs').rmSync('examples/basic-ts/.my-dev-kit-ci', { recursive: true, force: true })"
          node -e "require('fs').rmSync('examples/basic-python/.my-dev-kit-ci', { recursive: true, force: true })"
          node -e "require('fs').rmSync('tests/fixtures/compose-retrieval/basic-app/.my-dev-kit-ci-v1.11', { recursive: true, force: true })"
          node -e "require('fs').rmSync('tests/fixtures/android-test-semantic/basic-app/.my-dev-kit-ci-v1.11', { recursive: true, force: true })"
